[package]
name = "paper-renamer-gpui"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "PaperRenamer, pure-Rust GPUI edition"

[[bin]]
name = "PaperRenamer"
path = "src/main.rs"

[build-dependencies]
flate2 = "1"
embed-resource = "3"

[dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
lopdf = "0.34"
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
pdfium-render = "0.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
